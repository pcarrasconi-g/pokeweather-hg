# Se incluye dentro de http{} por la imagen nginx-unprivileged.
limit_req_zone $binary_remote_addr zone=pw_api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4k;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # DNS interno de Docker: re-resuelve `api` (sin 502 permanente si el contenedor se recrea).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    location /api/ {
        limit_req zone=pw_api burst=30 nodelay;
        error_page 429 = @rate_limited;
        error_page 502 503 = @bad_gateway;
        error_page 504 = @gateway_timeout;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;  # > presupuesto total de la API (12s)
        proxy_hide_header X-Powered-By;
        # nginx re-añade estas cabeceras: se ocultan las de la API para no duplicarlas.
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After "1" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 429 '{"error":{"code":"rate_limited","message":"Demasiadas solicitudes, inténtalo de nuevo en un momento"}}';
    }
    location @bad_gateway {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 502 '{"error":{"code":"upstream_error","message":"Servicio no disponible"}}';
    }
    location @gateway_timeout {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 504 '{"error":{"code":"upstream_timeout","message":"El servicio tardó demasiado"}}';
    }

    location / {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
